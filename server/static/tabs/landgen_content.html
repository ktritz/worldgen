<form id="landGenerationForm" class="space-y-3">
    <div class="param-group">
        <h3>Base Mesh Information</h3>
        <div id="baseMeshInfo" class="text-sm text-gray-600 p-2 bg-gray-100 rounded-md">
            Please generate or load an Icosphere & Voronoi mesh first.
        </div>
    </div>

    <div class="param-group">
        <h3>General Land Parameters</h3>
        <div>
            <label for="landSeed">Global Seed:</label>
            <input type="number" id="landSeed" name="landSeed" value="12345" class="form-input">
        </div>
    </div>

    <div class="param-group">
        <h3>Tectonic Plate Parameters</h3>
        <div>
            <label for="numPlates">Number of Plates:</label>
            <input type="number" id="numPlates" name="numPlates" value="10" min="1" class="form-input"
                title="Number of tectonic plates to generate.">
        </div>
        <div>
            <label for="baseSpeed">Base Plate Speed:</label>
            <input type="number" id="baseSpeed" name="baseSpeed" value="0.01" step="0.001" min="0" class="form-input"
                title="Average angular speed of plates.">
        </div>
        <div>
            <label for="speedVariationFactor">Speed Variation Factor:</label>
            <input type="number" id="speedVariationFactor" name="speedVariationFactor" value="0.5" step="0.1" min="0" max="2" class="form-input"
                title="Factor to vary plate speeds (e.g., 0.5 means speed can be BaseSpeed ± 50%).">
        </div>
        <div>
            <label for="targetContinentalProportion">Target Continental Proportion:</label>
            <input type="number" id="targetContinentalProportion" name="targetContinentalProportion" value="0.35" step="0.05" min="0" max="1"
                class="form-input" title="Proportion of surface area to be continental plates (e.g., 0.35 = 35%).">
        </div>
        <div>
            <label for="numInitialContinentalSeeds">Initial Continental Seeds:</label>
            <input type="number" id="numInitialContinentalSeeds" name="numInitialContinentalSeeds" value="3" min="1" max="20"
                class="form-input" title="Number of initial continental seed points for continent formation.">
        </div>
    </div>

    <div class="param-group">
        <h3>Elevation Parameters</h3>
        <div>
            <label for="noiseScale">Noise Scale (Future use for procedural noise):</label>
            <input type="number" id="noiseScale" name="noiseScale" value="1.0" step="0.05" class="form-input">
        </div>
        <div>
            <label for="noiseOctaves">Noise Octaves (Future use):</label>
            <input type="number" id="noiseOctaves" name="noiseOctaves" value="4" min="1" class="form-input">
        </div>
        <div>
            <label for="noisePersistence">Noise Persistence (Future use):</label>
            <input type="number" id="noisePersistence" name="noisePersistence" value="0.5" step="0.01" min="0" max="1"
                class="form-input">
        </div>
        <div>
            <label for="noiseLacunarity">Noise Lacunarity (Future use):</label>
            <input type="number" id="noiseLacunarity" name="noiseLacunarity" value="2.0" step="0.1" min="1"
                class="form-input">
        </div>
        <div>
            <label for="elevationMultiplier">Base Elevation Multiplier:</label>
            <input type="number" id="elevationMultiplier" name="elevationMultiplier" value="100" step="10" min="0"
                class="form-input" title="Base amplitude for elevation generation (meters).">
        </div>
    </div>

    <div class="param-group">
        <h3>Tectonic Boundary Effects</h3>
        <div>
            <label for="characteristicFalloffDistance">Characteristic Falloff Distance (% of radius):</label>
            <input type="number" id="characteristicFalloffDistance" name="characteristicFalloffDistance" value="0.15" step="0.01" min="0" max="1"
                class="form-input" title="Distance over which tectonic effects fade, as fraction of planet radius.">
        </div>
        <div>
            <label for="maxBoundaryEffectDistance">Max Boundary Effect Distance (% of radius):</label>
            <input type="number" id="maxBoundaryEffectDistance" name="maxBoundaryEffectDistance" value="0.45" step="0.01" min="0" max="1"
                class="form-input" title="Maximum distance for any tectonic boundary effects, as fraction of planet radius.">
        </div>
        <div>
            <label for="convergentBoundaryStrength">Convergent Boundary Strength (meters):</label>
            <input type="number" id="convergentBoundaryStrength" name="convergentBoundaryStrength" value="1000" step="100" min="0"
                class="form-input" title="Elevation boost from convergent boundaries (mountain formation).">
        </div>
        <div>
            <label for="divergentBoundaryStrength">Divergent Boundary Strength (meters):</label>
            <input type="number" id="divergentBoundaryStrength" name="divergentBoundaryStrength" value="500" step="50" min="0"
                class="form-input" title="Elevation depression from divergent boundaries (rift formation).">
        </div>
    </div>

    <div class="param-group">
        <h3>Output</h3>
        <div>
            <label for="landOutputName">Auxiliary Output Filename (e.g., debug_heightmap.png):</label>
            <input type="text" id="landOutputName" name="landOutputName" value="land_debug_output.png"
                class="form-input" title="Optional: filename for a debug image if the landgen library produces one.">
        </div>
    </div>
</form>
