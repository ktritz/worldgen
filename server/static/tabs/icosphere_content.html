<form id="generationForm" class="space-y-3">
    <div class="param-group">
        <h3>Icosphere</h3>
        <div>
            <label for="subdivisions">Subdivisions:</label>
            <input type="number" id="subdivisions" name="subdivisions" value="3" min="0" class="form-input">
        </div>
        <div>
            <label for="out">Icosphere Output OBJ Filename:</label>
            <input type="text" id="out" name="out" value="icosphere_generated.obj" class="form-input">
        </div>
    </div>

    <div class="param-group">
        <h3>Relaxation</h3>
        <div>
            <input type="checkbox" id="relaxEnable" name="relaxEnable" checked>
            <label for="relaxEnable" class="inline-block">Enable Relaxation</label>
        </div>
        <div class="relax-options mt-2 space-y-2">
            <div>
                <input type="checkbox" id="fixedInitial" name="fixedInitial" checked>
                <label for="fixedInitial" class="inline-block">Fix Initial 12 Vertices</label>
            </div>
            <div><label for="relaxK">K (Spring):</label><input type="number" id="relaxK" name="relaxK" value="10.0"
                    step="0.1" class="form-input"></div>
            <div><label for="relaxDamping">Damping:</label><input type="number" id="relaxDamping" name="relaxDamping"
                    value="2.0" step="0.1" class="form-input"></div>
            <div><label for="relaxDtInitial">Dt Initial:</label><input type="number" id="relaxDtInitial"
                    name="relaxDtInitial" value="0.01" step="0.001" class="form-input"></div>
            <div><label for="relaxMaxIterations">Max Iterations:</label><input type="number" id="relaxMaxIterations"
                    name="relaxMaxIterations" value="1000" class="form-input"></div>
            <div><label for="relaxTolerance">Tolerance:</label><input type="number" id="relaxTolerance"
                    name="relaxTolerance" value="1e-6" step="1e-7" class="form-input"></div>

            <div class="mt-1">
                <input type="checkbox" id="relaxAdaptiveDt" name="relaxAdaptiveDt" checked>
                <label for="relaxAdaptiveDt" class="inline-block">Adaptive Dt</label>
            </div>
            <div class="adaptive-dt-options mt-1 space-y-1 pl-4 border-l-2 border-gray-200">
                <div><label for="relaxDtMin">Dt Min:</label><input type="number" id="relaxDtMin" name="relaxDtMin"
                        value="1e-4" step="1e-5" class="form-input"></div>
                <div><label for="relaxDtMax">Dt Max:</label><input type="number" id="relaxDtMax" name="relaxDtMax"
                        value="0.1" step="0.01" class="form-input"></div>
                <div><label for="relaxDtIncreaseFactor">Dt Inc Factor:</label><input type="number"
                        id="relaxDtIncreaseFactor" name="relaxDtIncreaseFactor" value="1.05" step="0.01"
                        class="form-input"></div>
                <div><label for="relaxDtDecreaseFactor">Dt Dec Factor:</label><input type="number"
                        id="relaxDtDecreaseFactor" name="relaxDtDecreaseFactor" value="0.8" step="0.01"
                        class="form-input"></div>
                <div><label for="relaxMovThreshLow">Mov Thresh Low:</label><input type="number" id="relaxMovThreshLow"
                        name="relaxMovThreshLow" value="1e-7" step="1e-8" class="form-input"></div>
                <div><label for="relaxMovThreshHigh">Mov Thresh High:</label><input type="number"
                        id="relaxMovThreshHigh" name="relaxMovThreshHigh" value="1e-3" step="1e-4" class="form-input">
                </div>
            </div>
        </div>
    </div>

    <div class="param-group">
        <h3>Voronoi</h3>
        <div>
            <input type="checkbox" id="voronoiEnable" name="voronoiEnable" checked>
            <label for="voronoiEnable" class="inline-block">Enable Voronoi Generation</label>
        </div>
        <div class="voronoi-options mt-2 space-y-2">
            <div>
                <label for="voronoiOut">Voronoi Output OBJ Filename:</label>
                <input type="text" id="voronoiOut" name="voronoiOut" value="voronoi_generated.obj" class="form-input">
            </div>
            <div>
                <input type="checkbox" id="voronoiNgonSave" name="voronoiNgonSave" checked>
                <label for="voronoiNgonSave" class="inline-block">Save Voronoi as N-gons</label>
            </div>
        </div>
    </div>
</form>
