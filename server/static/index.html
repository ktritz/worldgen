<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worldgen UI</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        body.viewer-fullscreen-active>*:not(#mainContentAreaWrapper),
        body.viewer-fullscreen-active #hamburgerBtn,
        body.viewer-fullscreen-active #parametersColumn,
        body.viewer-fullscreen-active #mainContentAreaWrapper>#mainContentArea>header,
        body.viewer-fullscreen-active #mainContentAreaWrapper>#mainContentArea>.tab-navigation-bar {
            display: none !important;
        }

        body.viewer-fullscreen-active .viewer-controls>button:not(#toggleFullscreenBtn) {
            display: none !important;
        }

        body.viewer-fullscreen-active .viewer-controls>div:not(#viewerMainControlsGroup) {
            display: none !important;
        }

        body.viewer-fullscreen-active #viewerMainControlsGroup>*:not(#toggleFullscreenBtn) {
            display: none !important;
        }


        body.viewer-fullscreen-active .viewer-controls {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 110;
            background: transparent !important;
            padding: 0 !important;
            border-radius: 0.25rem !important;
        }

        body.viewer-fullscreen-active #viewerColumn {
            padding: 0 !important;
        }

        .tab-button {
            padding: 0.75rem 1rem;
            font-weight: 500;
            color: #6B7280;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease-in-out;
        }

        .tab-button:disabled {
            color: #9CA3AF;
            cursor: not-allowed;
            border-bottom-color: transparent !important;
        }

        .tab-button:disabled:hover {
            color: #9CA3AF;
        }


        .tab-button:not(:disabled):hover {
            color: #374151;
            border-bottom-color: #D1D5DB;
        }

        .tab-button.active-tab {
            color: #2563EB;
            border-bottom-color: #2563EB;
        }

        #parametersColumn {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 350px;
            background-color: #f9fafb;
            padding-top: 4rem;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            z-index: 40;
            display: flex;
            flex-direction: column;
        }

        #parametersColumn.is-open {
            transform: translateX(0);
        }

        .parameters-header {
            padding: 0 1.5rem;
            margin-bottom: 1rem;
        }

        .parameters-form-container {
            padding: 0 1.5rem 1.5rem 1.5rem;
            flex-grow: 1;
            overflow-y: auto;
        }

        #mainContentAreaWrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        #mainContentArea {
            transition: margin-left 0.3s ease-in-out, width 0.3s ease-in-out;
            width: 100%;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        #mainContentArea.panel-is-open {
            margin-left: 350px;
            width: calc(100% - 350px);
        }

        body.viewer-fullscreen-active #mainContentArea.panel-is-open {
            margin-left: 0;
            width: 100%;
        }

        body.viewer-fullscreen-active #mainContentArea {
            margin-left: 0 !important;
            width: 100% !important;
            padding: 0 !important;
        }

        #hamburgerBtn {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 50;
            padding: 0.5rem;
            background-color: rgba(75, 85, 99, 0.7);
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #hamburgerBtn:hover {
            background-color: rgba(55, 65, 81, 0.9);
        }

        #hamburgerBtn .line {
            width: 24px;
            height: 3px;
            background-color: white;
            margin: 5px 0;
            transition: all 0.3s ease;
        }

        #hamburgerBtn.is-active .line1 {
            transform: rotate(-45deg) translate(-5px, 6px);
        }

        #hamburgerBtn.is-active .line2 {
            opacity: 0;
        }

        #hamburgerBtn.is-active .line3 {
            transform: rotate(45deg) translate(-5px, -6px);
        }

        #viewerColumn {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .tab-content-wrapper {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .param-group {
            background-color: #ffffff;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }

        label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 500;
        }

        input[type="number"],
        input[type="text"],
        select {
            width: 100%;
            padding: 0.5rem;
            border-radius: 0.375rem;
            border: 1px solid #D1D5DB;
            margin-bottom: 0.75rem;
            background-color: #F9FAFB;
            color: #1F2937;
        }

        input[type="checkbox"] {
            margin-right: 0.5rem;
            accent-color: #3B82F6;
        }

        .param-group h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #1F2937;
            border-bottom: 1px solid #E5E7EB;
            padding-bottom: 0.5rem;
        }

        .viewer-controls button,
        .viewer-controls label {
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: background-color 0.15s ease-in-out;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }

        .btn i {
            margin-right: 0.375rem;
        }

        .btn-primary {
            background-color: #2563EB;
            color: white;
        }

        .btn-primary:hover {
            background-color: #1D4ED8;
        }

        .btn-secondary {
            background-color: #4B5563;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #374151;
        }

        .btn-active {
            background-color: #1D4ED8;
        }

        /* Style for disabled buttons in viewer controls */
        .viewer-controls button:disabled {
            background-color: #9CA3AF;
            /* Tailwind: bg-gray-400 */
            color: #E5E7EB;
            /* Tailwind: text-gray-200 */
            cursor: not-allowed;
        }

        .viewer-controls button:disabled:hover {
            background-color: #9CA3AF;
            /* Keep same background on hover for disabled */
        }


        #viewerContainer {
            width: 100%;
            flex-grow: 1;
            background-color: #111827;
            border-radius: 0.5rem;
            position: relative;
            border: 1px solid #D1D5DB;
            transition: all 0.3s ease-in-out;
        }

        #viewerContainer.viewer-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 100;
            border-radius: 0;
            border: none;
            margin-top: 0 !important;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "/static/js/three_local/build/three.module.js",
                "three/addons/": "/static/js/three_local/examples/jsm/"
            }
        }
    </script>
</head>

<body class="bg-gray-200 text-gray-800 antialiased">

    <button id="hamburgerBtn">
        <div class="line line1"></div>
        <div class="line line2"></div>
        <div class="line line3"></div>
    </button>

    <div id="parametersColumn" class="h-screen">
        <div class="parameters-header">
            <h2 id="parametersTitle" class="text-2xl font-semibold mb-4 text-gray-700">Parameters</h2>
            <button id="mainGenerateBtn" type="button" class="w-full btn btn-primary py-3 text-lg mb-4">
                Generate
            </button>
        </div>
        <div id="parametersFormContainer" class="parameters-form-container">
            <p class="text-gray-500">Select a tab to view parameters.</p>
        </div>
    </div>

    <div id="mainContentAreaWrapper" class="flex-grow flex flex-col">
        <div id="mainContentArea" class="container mx-auto p-4 md:p-8">
            <header class="mb-6 flex justify-between items-center">
                <h1 class="text-4xl font-bold text-gray-700 ml-16">Worldgen Control Panel</h1>
            </header>

            <div class="tab-navigation-bar mb-6 border-b border-gray-300">
                <nav class="flex space-x-4" aria-label="Tabs">
                    <button class="tab-button active-tab" data-tab-id="icosphere"
                        data-tab-content-url="/static/tabs/icosphere_content.html"
                        data-tab-js="/static/js/icosphere_handler.js">
                        Icosphere & Voronoi
                    </button>
                    <button class="tab-button" data-tab-id="landgen"
                        data-tab-content-url="/static/tabs/landgen_content.html"
                        data-tab-js="/static/js/landgen_handler.js" id="landgenTabButton" disabled>
                        Land Generation
                    </button>
                </nav>
            </div>

            <div id="viewerColumn" class="w-full">
                <h2 class="text-2xl font-semibold mb-1 text-gray-700">3D Viewer</h2>
                <div id="statusMessage"
                    class="mb-3 p-3 text-sm bg-blue-50 border border-blue-200 text-blue-700 rounded-lg hidden">Status
                    messages will appear here.</div>

                <div class="viewer-controls flex flex-wrap items-center bg-gray-100 p-2 rounded-md shadow mb-3">
                    <button id="showIcosphereBtn" class="btn btn-secondary">Show Icosphere</button>
                    <button id="showVoronoiBtn" class="btn btn-secondary">Show Voronoi</button>
                    <button id="showElevationBtn" class="btn btn-secondary">Show Elevation</button>
                    <button id="showLandBtn" class="btn btn-secondary hidden">Show Land</button>

                    <div class="ml-auto flex items-center space-x-3" id="viewerMainControlsGroup">
                        <label class="flex items-center"><input type="checkbox" id="viewerWireframeCheckbox">
                            Wireframe</label>
                        <label class="flex items-center"><input type="checkbox" id="viewerAutoRotateCheckbox">
                            Auto-Rotate</label>
                        <button id="toggleFullscreenBtn" class="btn btn-secondary px-2 py-1 text-sm"
                            title="Toggle Fullscreen">
                            <i class="fas fa-expand"></i>
                        </button>
                    </div>
                </div>

                <div id="viewerContainer">
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/static/js/app_shell.js"></script>
</body>

</html>
